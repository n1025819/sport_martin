<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="我的 Strava 公開活動摘要">
  <title>我的 Strava 活動</title>
  <link rel="icon" type="image/png" href="docs/strava_icon.png">
  <style>
    :root { color-scheme: dark; --orange: #fc4c02; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f7f7f7;
      background:
        radial-gradient(circle at 18% 12%, rgba(252, 76, 2, .24), transparent 34rem),
        radial-gradient(circle at 82% 84%, rgba(77, 94, 255, .16), transparent 30rem),
        #08090d;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .55;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.7) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.35) 0 1px, transparent 1.5px);
      background-position: 0 0, 42px 36px;
      background-size: 96px 96px, 128px 128px;
    }
    .page {
      position: relative;
      z-index: 1;
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 64px;
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .back, .profile {
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 14px;
    }
    .back:hover, .profile:hover { border-color: var(--orange); color: #ff8a58; }
    main { padding-top: clamp(56px, 12vh, 110px); text-align: center; }
    .eyebrow { color: var(--orange); font-size: 12px; font-weight: 700; letter-spacing: .2em; }
    h1 { margin: 10px 0 8px; font-size: clamp(30px, 7vw, 48px); line-height: 1.08; }
    .intro { margin: 0 auto 28px; color: #aeb1bb; line-height: 1.7; }
    .embed-card {
      width: min(100%, 390px);
      margin: 0 auto;
      padding: 28px;
      overflow: hidden;
      border: 1px solid rgba(252,76,2,.35);
      border-radius: 24px;
      background: rgba(13,14,20,.78);
      box-shadow: 0 26px 80px rgba(0,0,0,.45), 0 0 36px rgba(252,76,2,.1);
      backdrop-filter: blur(18px);
    }
    .strava-embed { display: block; width: 300px; max-width: 100%; height: 160px; margin: 0 auto; border: 0; }
    .note { margin: 22px 0 0; color: #777c89; font-size: 12px; line-height: 1.6; }
    @media (max-width: 390px) {
      .embed-card { padding: 20px 12px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .back, .profile { text-align: center; }
    }
  </style>
</head>
<body>
  <div class="page">
    <nav class="topbar" aria-label="頁面導覽">
      <a class="back" href="linkTreeIndex.html">← 回首頁</a>
      <a class="profile" href="https://www.strava.com/athletes/117683817" target="_blank" rel="noopener noreferrer">在 Strava 查看完整檔案 ↗</a>
    </nav>
    <main>
      <div class="eyebrow">LIVE FROM STRAVA</div>
      <h1>我的活動</h1>
      <p class="intro">這裡直接顯示我的 Strava 公開活動摘要。</p>
      <section class="embed-card" aria-label="Strava 活動摘要">
        <iframe
          class="strava-embed"
          title="我的 Strava 活動摘要"
          height="160"
          width="300"
          frameborder="0"
          allowtransparency="true"
          scrolling="no"
          loading="lazy"
          src="https://www.strava.com/athletes/117683817/activity-summary/12751bd020d14f2142868116afdc6b994c28e43b">
        </iframe>
        <p class="note">內容由 Strava 官方 Embed 提供，只會顯示符合你 Strava 隱私設定的活動。</p>
      </section>
    </main>
  </div>
</body>
</html>
